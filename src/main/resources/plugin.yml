name: MobAssault
version: 1.0.0
main: cn.popcraft.mobassault.MobAssault
api-version: 1.17
authors: [PopCraft]
description: 通过命令生成怪物攻击玩家的插件

commands:
  mobassault:
    description: MobAssault 主命令
    usage: /mobassault <subcommand>
    aliases: [ma]
    permission: mobassault.use

permissions:
  mobassault.*:
    description: 所有权限
    default: op
    children:
      mobassault.spawn: true
      mobassault.egg: true
      mobassault.remove: true
      mobassault.removeall: true
      mobassault.list: true
      mobassault.reload: true
      mobassault.config: true
      mobassault.use: true

  mobassault.use:
    description: 允许使用插件
    default: true

  mobassault.spawn:
    description: 允许生成怪物
    default: op

  mobassault.egg:
    description: 允许获取自定义刷怪蛋
    default: op

  mobassault.remove:
    description: 允许移除怪物
    default: op

  mobassault.removeall:
    description: 允许移除所有怪物
    default: op

  mobassault.list:
    description: 允许查看怪物列表
    default: true

  mobassault.reload:
    description: 允许重载配置
    default: op

  mobassault.config:
    description: 允许查看配置
    default: op
