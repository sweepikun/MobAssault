# 火焰傀儡配置
name: "&6火焰傀儡"
type: IRON_GOLEM

attributes:
  health: 100.0
  damage: 15.0
  speed: 0.25
  armor: 10.0
  knockback-resistance: 0.8

weapon:
  main-hand:
    material: BLAZE_ROD
    name: "&6烈焰之杖"
    lore:
      - "&7燃烧着不灭的火焰"
    enchantments:
      - type: FIRE_ASPECT
        level: 2

armor:
  helmet:
    material: CHAINMAIL_HELMET
    enchantments:
      - type: PROTECTION_FIRE
        level: 4
  chestplate:
    material: CHAINMAIL_CHESTPLATE
    enchantments:
      - type: PROTECTION_FIRE
        level: 4

attack:
  interval: 30
  accuracy: 0.9
  range: 4.0

target:
  type: PERMISSION_GROUP
  groups:
    - "player"
    - "vip"

behaviors:
  fireball:
    enabled: true
    interval: 40
    speed: 2.0
    damage: 8.0
    accuracy: 0.9
    type: LARGE

  explosion:
    enabled: true
    trigger-distance: 4.0
    power: 3.0
    fire: true
    break-blocks: false

  command:
    enabled: true
    interval: 80
    commands:
      - "summon lightning_bolt %x% %y% %z%"

  kether:
    enabled: true
    interval: 60
    script: |
      tell "火焰傀儡正在释放烈焰！"
      damage 10
      potion-effect "fire_resistance" 30 1
